# Compila y publica una version de Boomer Shooter desde GitHub Actions.
#
# Por que existe: GitLab da 400 minutos de CI al mes en el plan gratuito y se acaban (error
# "ci_quota_exceeded"). GitHub Actions es gratis y sin limite en repositorios publicos.
#
# Que hace con cada tag vX.Y.Z (igual que el pipeline de GitLab):
#   1. compila Windows, Linux, Web e iOS (IPA sin firmar), todos con el servidor online inyectado,
#   2. sube los binarios al paquete de descargas de GitLab (donde ya estan las versiones anteriores),
#   3. regenera site/update.json con los hashes reales,
#   4. crea la release con sus enlaces,
#   5. empuja el manifiesto y la web a main de GitLab, que es lo que sirve Vercel.
#
# Secretos del repositorio (Settings > Secrets and variables > Actions):
#   NAKAMA_HOST, NAKAMA_SERVER_KEY  servidor online que se inyecta en cada compilacion
#   GITLAB_TOKEN                    para subir al paquete, crear la release y empujar el manifiesto
#
#   git tag -a v1.3.0 -m "Notas;separadas por punto y coma"
#   git push origin v1.3.0

name: Publicar version

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar (ej. 1.3.0). Vacio = la del proyecto."
        required: false
        default: ""

env:
  GODOT_VERSION: "4.7-stable"
  GITLAB_PROYECTO: "85907027"
  DESCARGAS_PROYECTO: "88475071"

jobs:
  escritorio_y_web:
    name: Windows, Linux y Web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot y plantillas
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends unzip libfontconfig1 osslsigncode
          curl -fL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          curl -fL -o plantillas.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          PLANTILLAS="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$PLANTILLAS"
          unzip -q -j plantillas.tpz 'templates/*' -d "$PLANTILLAS"
          godot --version

      - name: Inyectar servidor online
        env:
          NAKAMA_HOST: ${{ secrets.NAKAMA_HOST }}
          NAKAMA_SERVER_KEY: ${{ secrets.NAKAMA_SERVER_KEY }}
        run: sh tools/write_online_defaults.sh "$GITHUB_WORKSPACE/online_defaults.cfg"

      - name: Importar el proyecto
        run: godot --headless --path "$GITHUB_WORKSPACE" --editor --quit || true

      - name: Compilar Windows
        run: |
          mkdir -p Build/Windows
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Windows Desktop" "Build/Windows/BoomerShooter.exe"
          sh tools/sign_windows.sh "Build/Windows/BoomerShooter.exe"
          ls -la Build/Windows

      - name: Compilar Linux
        run: |
          mkdir -p Build/Linux
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Linux" "Build/Linux/boomershooter.x86_64"
          ls -la Build/Linux

      - name: Compilar Web (iPhone en Safari)
        run: |
          mkdir -p Build/Web
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Web" "Build/Web/index.html"
          ls -la Build/Web

      - name: Guardar binarios
        uses: actions/upload-artifact@v4
        with:
          name: escritorio-y-web
          path: Build/
          retention-days: 30
          if-no-files-found: error

  ipa:
    name: IPA de iPhone (sin firmar)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot 4.7 y plantillas de exportacion
        run: |
          set -e
          curl -fL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          sudo mv Godot.app /Applications/
          GODOT="/Applications/Godot.app/Contents/MacOS/Godot"
          "$GODOT" --version
          PLANTILLAS="$HOME/Library/Application Support/Godot/export_templates/4.7.stable"
          mkdir -p "$PLANTILLAS"
          curl -fL -o plantillas.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q plantillas.tpz
          cp templates/ios.zip "$PLANTILLAS/"
          cp templates/version.txt "$PLANTILLAS/" 2>/dev/null || true

      - name: Inyectar servidor online
        env:
          NAKAMA_HOST: ${{ secrets.NAKAMA_HOST }}
          NAKAMA_SERVER_KEY: ${{ secrets.NAKAMA_SERVER_KEY }}
        run: sh tools/write_online_defaults.sh online_defaults.cfg

      - name: Exportar y empaquetar la IPA sin firmar
        env:
          GODOT: /Applications/Godot.app/Contents/MacOS/Godot
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'ABCDE12345' }}
        run: sh tools/build_ios_unsigned.sh

      - name: Validar la IPA (estructura, arm64, permisos)
        run: python3 tools/validar_ipa.py Build/iOS/*.ipa

      - name: Comprobar que el servidor online quedo dentro de la IPA
        run: |
          python3 - <<'PY'
          import glob, zipfile
          z = zipfile.ZipFile(glob.glob("Build/iOS/*.ipa")[0])
          pck = [n for n in z.namelist() if n.endswith(".pck")][0]
          datos = z.read(pck)
          assert b"online_defaults.cfg" in datos, "FALTA online_defaults.cfg dentro de la IPA: el online estaria muerto"
          assert b"BoomerShooterSecretKey2026" not in datos, "la clave vieja sigue dentro"
          print("OK: la IPA lleva el servidor online y no la clave vieja")
          PY

      - name: Parche de contenido para iPhone (actualizacion remota sin reinstalar)
        env:
          GODOT: /Applications/Godot.app/Contents/MacOS/Godot
        run: |
          set -e
          mkdir -p Build/Parche
          # La base es el pack de la IPA instalada (v1.3.0). Siempre se calcula contra ella para
          # que el parche sirva desde cualquier version intermedia.
          curl -fL -o Build/Parche/base-ios.pck "https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.3.0/base-ios.pck"
          sh tools/build_ios_patch.sh Build/Parche/base-ios.pck Build/Parche/content-ios.pck
          ls -la Build/Parche

      - name: Guardar la IPA y el parche
        uses: actions/upload-artifact@v4
        with:
          name: BoomerShooter-ipa-sin-firmar
          path: |
            Build/iOS/*.ipa
            Build/Parche/content-ios.pck
          if-no-files-found: error
          retention-days: 90

  publicar:
    name: Publicar descargas, manifiesto y release
    needs: [escritorio_y_web, ipa]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Codigo de esta version (para copiar la web y las rutas de descarga)
        uses: actions/checkout@v4
        with:
          path: fuente

      - name: Clonar el repositorio de GitLab (es el que sirve Vercel)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -e
          git clone --depth 50 "https://oauth2:${GITLAB_TOKEN}@gitlab.com/rewardnexus000/boomershooter.git" repo
          git -C repo config user.name "Boomer Shooter CI"
          git -C repo config user.email "ci@xpe.nettt"
          # La web y las rutas /api/download viven en GitHub: se copian al clon de GitLab (menos
          # site/play y update.json, que se regeneran mas abajo). Asi Vercel recibe, por ejemplo,
          # /api/download/ios-patch y el boton de iPhone.
          rsync -a --exclude 'play' --exclude 'update.json' fuente/site/ repo/site/
          # Las herramientas de publicacion tambien son las de ESTA version, no las que haya en
          # el repo de GitLab (que puede ir por detras).
          rsync -a fuente/tools/ repo/tools/

      - uses: actions/download-artifact@v4
        with:
          name: escritorio-y-web
          path: repo/Build

      - uses: actions/download-artifact@v4
        with:
          name: BoomerShooter-ipa-sin-firmar
          path: repo/Build/IPA

      - name: Subir binarios, generar manifiesto y crear la release
        working-directory: repo
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publicando $VERSION"
          test -f Build/Windows/BoomerShooter.exe
          # Las notas son el mensaje del tag ANOTADO. Se leen de la API de GitHub: el checkout
          # convierte el tag en una referencia ligera y git devolveria el mensaje del commit.
          SHA_TAG="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")"
          CI_COMMIT_TAG_MESSAGE="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/tags/${SHA_TAG}" | python3 -c "import json,sys; print(json.load(sys.stdin)['message'].strip())")"
          export CI_COMMIT_TAG_MESSAGE
          echo "notas: $CI_COMMIT_TAG_MESSAGE"
          subir() {
            curl --fail --silent --show-error --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              --upload-file "$1" \
              "https://gitlab.com/api/v4/projects/${DESCARGAS_PROYECTO}/packages/generic/boomershooter/${VERSION}/$2"
          }
          subir Build/Windows/BoomerShooter.exe BoomerShooter.exe
          subir Build/Linux/boomershooter.x86_64 boomershooter.x86_64
          # Parche de iPhone: se sube al paquete y se declara en patch_ios (aparte del de PC).
          PARCHE="$(find Build/IPA -name content-ios.pck | head -1)"
          test -f "$PARCHE"
          subir "$PARCHE" content-ios.pck
          ARGS="--version ${VERSION} --windows Build/Windows/BoomerShooter.exe --linux Build/Linux/boomershooter.x86_64"
          ARGS="$ARGS --patch-ios $PARCHE --patch-ios-url https://boomershooter.vercel.app/api/download/ios-patch --base-ios 1.3.0"
          python3 tools/publish_update.py $ARGS
          cat site/update.json
          python3 tools/crear_release.py --version "${VERSION}" --plataformas "windows,linux"

      - name: Release de GitHub con la IPA sin firmar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          IPA="$(find repo/Build/IPA -name '*.ipa' | head -1)"
          test -f "$IPA"
          SHA_TAG="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" | python3 -c "import json,sys; print(json.load(sys.stdin)['object']['sha'])")"
          NOTAS="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/tags/${SHA_TAG}" | python3 -c "import json,sys; print(json.load(sys.stdin)['message'].strip())")"
          CUERPO="$(printf '%s' "$NOTAS" | tr ';' '\n' | sed 's/^ *//; /^$/d; s/^/- /')"
          printf '**Boomer Shooter %s**\n\n%s\n\nIPA sin firmar: se instala con Gbox, Sideloadly o AltStore. Windows y Linux: https://boomershooter.vercel.app\n' "$VERSION" "$CUERPO" > notas.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$IPA" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --notes-file notas.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$IPA" --title "v${VERSION}" --notes-file notas.md --repo "$GITHUB_REPOSITORY"
          fi

      - name: Empujar manifiesto y version web a GitLab (Vercel los publica)
        working-directory: repo
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -d Build/Web ]; then rm -rf site/play && mkdir -p site/play && cp -r Build/Web/. site/play/; fi
          git add site
          [ -d site/play ] && git add -f site/play
          git diff --cached --quiet || git commit -m "Publicada la ${VERSION} (manifiesto y descargas)"
          git pull --rebase -q origin main
          git push origin HEAD:main
